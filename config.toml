# tickr configuration.

[dashboard]
theme = "tokyo-night"
# Layout: a list of columns, each a list of stacked panels. The last column
# flexes to fill the window width.
# Available: "weather", "stocks", "rates", "claude_usage", "predict", "oddities", "news".
columns = [["weather", "stocks", "rates", "predict", "claude_usage", "oddities"], ["news"]]
# Default seconds between data fetches (a source can override its own).
refresh_seconds = 60
# Animation cadence — how often the pane redraws (drives the news ticker crawl).
tick_seconds = 0.5
# Width (columns) of the left side panels. Widen if usage numbers get clipped.
# Nudge it live from the dashboard with `[` (narrower) and `]` (wider) — the new
# width autosaves back here. The last column flexes to fill the rest of the window.
left_width = 56
# Per-panel height: add `height = N` (rows) to any panel's own table below to
# pin it to N rows instead of fitting its content — content scrolls inside if it
# overflows. Lets you stop a tall panel (e.g. rates) from dominating its column.
# Unset = auto (fit content), the default. e.g. under [rates]: height = 8
# true  = take over the window (clean dedicated panel; Ctrl-C restores your shell).
# false = render inline under your prompt (you can keep typing, but it restacks).
fullscreen = true
# Color theme. Switch live in the command palette (Ctrl-P -> "theme") and it
# autosaves here. Or set manually — e.g. "textual-dark", "textual-light", "nord",
# "gruvbox", "dracula", "tokyo-night", "monokai", "flexoki", "catppuccin-mocha".
# Unset = Textual default. (Currently set above in [dashboard].)

[claude_usage]
# By default tickr auto-discovers every ~/.claude* config home (any with a
# projects/ dir), so new accounts appear with no edit; idle ones are hidden.
# The row label is derived from the dir name (~/.claude-berry -> "berry",
# ~/.claude -> "default"). Shows API-equivalent $ today/week + the 5-hour window.
# Uncomment to pin an explicit list instead of auto-discovery:
# homes = ["~/.claude", "~/.claude-berry", "~/.claude-cheng"]
homes = ["~/.claude", "~/.claude-berry"]

[news]
# Vertical headline feed (top-stories firehose). Shows `rows` headlines and
# rolls by one every `scroll_seconds`; refetches new headlines infrequently.
# Shortcut: instead of pasting feed URLs, reference curated topics from the
# catalog — `tickr catalog` lists them. Merged with any explicit `feeds` below.
# topics = ["business", "tech", "politics"]
refresh_seconds = 300
rows = 14             # how many headlines visible at once
scroll_seconds = 4   # seconds before the feed advances one headline
# Direct RSS feeds — real article links, so cmd-click and the in-terminal reader
# (enter / o) work. Merged + deduped + sorted newest-first.
# Curated to business / finance / econ / tech / politics — topic-specific section
# feeds (not the general "world" firehose) so the feed isn't crime/tabloid noise.
# NOTE: feeds must be RSS (<item>); Atom feeds (The Verge) aren't parsed yet.
feeds = [
    # Business / finance / economics (all readable in the in-term reader)
    "https://feeds.bbci.co.uk/news/business/rss.xml",
    "https://www.theguardian.com/business/rss",
    "https://feeds.npr.org/1006/rss.xml",
    "https://www.cnbc.com/id/10001147/device/rss/rss.html",
    "https://fortune.com/feed/",
    # Tech
    "https://feeds.arstechnica.com/arstechnica/index",
    "https://feeds.bbci.co.uk/news/technology/rss.xml",
    "https://techcrunch.com/feed/",
    "https://hnrss.org/frontpage",
    # Politics
    "https://www.theguardian.com/us-news/us-politics/rss",
    "https://feeds.npr.org/1014/rss.xml",
]
# query = "technology OR AI"   # if `feeds` is removed: Google News firehose (browser-only links)
# Drop headlines containing any of these (case-insensitive substrings). Safety net
# on top of topic feeds — catches stray celebrity/sport/royal items that slip in.
exclude = ["horoscope", "celebrity", "kardashian", "royal family"]

[weather]
# Current conditions + 4-day forecast as ASCII art (Open-Meteo, no key).
refresh_seconds = 900
unit = "fahrenheit"     # or "celsius"
# Location auto-detects: macOS Location Services first (grant your terminal app
# permission in System Settings > Privacy > Location Services), IP as fallback.
# Pin it to skip detection entirely:
# latitude = 37.77
# longitude = -122.42
# label = "San Francisco"

[predict]
# Live Polymarket odds (public Gamma API, no key). One line per event: the
# favorite outcome's probability + its 24h move. Ordered by 24h volume.
refresh_seconds = 300
count = 12              # how many markets to show
# Polymarket tag slugs to pull from (try: politics, geopolitics, world,
# elections, economy). NO crypto. `tickr` ships a sensible default of ["politics"].
tags = ["politics", "Basketball"]
# Drop markets whose label contains any of these (case-insensitive):
exclude = ["# tweets", "tweets"]

[rates]
# US Treasury daily par yield curve — free, no API key. The always-on panel
# shows a compact ladder (4wk/13wk/26wk/52wk/2Y/10Y/30Y); the 26-week bill is
# emphasised. Yields are shown as %, with the day-over-day move in basis points.
# Press `r` (or enter/click the panel) for the full curve — every tenor plus an
# ASCII chart. Treasury posts once per business day, so the refresh is slow on
# purpose.
refresh_seconds = 3600
# Which tenors show in the always-on panel (the `r` popup always shows the full
# curve + an ASCII chart). Default is a compact set so the panel stays short:
# ladder = ["4wk", "13wk", "26wk", "52wk", "2Y", "10Y", "30Y"]
# height = 9   # or pin the panel height (rows) and let it scroll

[stocks]
# Yahoo Finance symbols. Plain tickers work as-is (AAPL, NVDA). Indices use a
# leading caret: ^IXIC = Nasdaq Composite, ^GSPC = S&P 500, ^DJI = Dow.
# All symbols are fetched in a single batched request per cycle.
# Shortcut: `sets` references curated ticker groups from the catalog (run
# `tickr catalog`), merged with any explicit `tickers` below. e.g.:
# sets = ["indices", "gold"]
tickers = [
    "^GSPC",
    "^IXIC",
    "^IRX",
    "NVDA",
    "AAPL",
    "GOOG",
    "AMZN",
    "META",
    "TSLA",
    "GC=F",
    "EAT",
    "MSFT",
]

[oddities]
# Ambient-delight panel: next rocket launch + live countdown (Launch Library 2),
# recent earthquakes (USGS GeoJSON), and where the ISS is right now
# (wheretheiss.at). All free, no API key. A short refresh keeps the ISS sub-point
# moving; the launch + quake feeds are cached internally on longer cadences so
# the panel stays polite to each upstream (Launch Library throttles anon clients).
refresh_seconds = 30
min_mag = 2.5        # only show quakes at/above this magnitude
quake_rows = 4       # how many recent quakes to list
place_width = 26     # truncate the quake location to this many columns
